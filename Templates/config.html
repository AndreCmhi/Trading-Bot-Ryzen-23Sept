<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config | Ryzen Spot Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#070b12; color:#e8eefc; }
    .panel { background:#101827; border:1px solid #253756; border-radius:18px; }
    .form-control,.form-select { background:#0b1220; border-color:#284366; color:#fff; }
    .form-control:focus,.form-select:focus { background:#0b1220; color:#fff; border-color:#5bc0de; box-shadow:none; }
    label { color:#a9b7d3; font-size:.9rem; }
    .hint { color:#91a2c7; font-size:.85rem; }
  </style>
</head>
<body class="p-3 p-md-5">
  <div class="container" style="max-width: 980px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-1">Setting Spot Ideal</h2>
        <div class="hint">Profile aman: spot 1x, AI aktif, risk kecil, trailing cepat.</div>
      </div>
      <a href="/" class="btn btn-outline-light">Dashboard</a>
    </div>

    <form id="settingsForm" class="panel p-4">
      <input type="hidden" name="market_type" value="SPOT">
      <input type="hidden" name="preferred_margin_mode" value="SPOT_ONLY">
      <input type="hidden" name="default_leverage" value="1">
      <input type="hidden" name="leverage_boost_enabled" value="false">
      <input type="hidden" name="leverage_boost_target" value="1">

      <div class="row g-3">
        <div class="col-md-4">
          <label>Strategy Mode</label>
          <select name="strategy_mode" class="form-select">
            <option>SCALPING</option><option>BALANCED</option><option>PRECISION</option><option>TARGET_75</option><option>AGGRESSIVE</option>
          </select>
        </div>
        <div class="col-md-4">
          <label>Trading Style</label>
          <select name="trading_style" class="form-select">
            <option>AUTO</option><option>SCALPING</option><option>TREND_FOLLOWING</option><option>BREAKOUT</option>
          </select>
        </div>
        <div class="col-md-4">
          <label>AI Enabled</label>
          <select name="ai_enabled" class="form-select"><option value="true">ON</option><option value="false">OFF</option></select>
        </div>

        <div class="col-md-3"><label>Risk / Trade %</label><input name="risk_per_trade_percent" type="number" step="0.05" min="0.05" max="1" class="form-control"></div>
        <div class="col-md-3"><label>Max Risk %</label><input name="max_risk_per_trade_percent" type="number" step="0.05" min="0.05" max="1" class="form-control"></div>
        <div class="col-md-3"><label>Balance Dipakai %</label><input name="active_margin_balance_percent" type="number" step="0.5" min="1" max="20" class="form-control"></div>
        <div class="col-md-3"><label>Fixed Notional USDT</label><input name="fixed_trade_notional_usdt" type="number" step="0.5" min="5" class="form-control"></div>

        <div class="col-md-3"><label>Min Notional USDT</label><input name="min_trade_notional_usdt" type="number" step="0.5" min="5" class="form-control"></div>
        <div class="col-md-3"><label>Min Score</label><input name="min_score" type="number" min="8" max="20" class="form-control"></div>
        <div class="col-md-3"><label>Max Open Posisi</label><input name="max_open_positions" type="number" min="1" max="4" class="form-control"></div>
        <div class="col-md-3"><label>Max Daily Loss USDT</label><input name="max_daily_loss_usdt" type="number" step="0.5" min="1" class="form-control"></div>

        <div class="col-md-3"><label>Max Trade / Jam</label><input name="max_trades_per_hour" type="number" min="1" max="6" class="form-control"></div>
        <div class="col-md-3"><label>Max Loss / Jam</label><input name="max_losses_per_hour" type="number" min="1" max="3" class="form-control"></div>
        <div class="col-md-3"><label>Hourly Loss USDT</label><input name="hourly_loss_limit_usdt" type="number" step="0.5" min="0.5" class="form-control"></div>
        <div class="col-md-3"><label>Cooldown Loss Menit</label><input name="loss_cooldown_minutes" type="number" min="0" class="form-control"></div>

        <div class="col-md-3"><label>Auto Close ROI %</label><input name="auto_close_roi_percent" type="number" step="0.1" min="0.5" class="form-control"></div>
        <div class="col-md-3"><label>Hard Stop ROI %</label><input name="hard_stop_roi_percent" type="number" step="0.1" max="-0.1" class="form-control"></div>
        <div class="col-md-3"><label>Trailing Trigger %</label><input name="trailing_trigger_roi_percent" type="number" step="0.1" min="0.3" class="form-control"></div>
        <div class="col-md-3"><label>Trailing Callback %</label><input name="trailing_callback_roi_percent" type="number" step="0.05" min="0.05" class="form-control"></div>

        <div class="col-md-3"><label>Fast Trigger %</label><input name="fast_trailing_trigger_roi_percent" type="number" step="0.1" min="0.2" class="form-control"></div>
        <div class="col-md-3"><label>Fast Callback %</label><input name="fast_trailing_callback_roi_percent" type="number" step="0.05" min="0.05" class="form-control"></div>
        <div class="col-md-3"><label>Min ADX</label><input name="min_adx" type="number" step="0.5" min="10" class="form-control"></div>
        <div class="col-md-3"><label>Min Volume Ratio</label><input name="min_volume_ratio" type="number" step="0.1" min="0.5" class="form-control"></div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-success px-4" type="submit">Save Spot Setting</button>
        <button class="btn btn-outline-info" type="button" id="idealBtn">Load Ideal</button>
        <span id="message" class="align-self-center hint"></span>
      </div>
    </form>
  </div>

  <script>
    const csrfToken = "{{ csrf_token }}";
    const form = document.getElementById('settingsForm');
    const ideal = {
      market_type:'SPOT', ai_enabled:true, strategy_mode:'SCALPING', trading_style:'AUTO',
      risk_per_trade_percent:0.6, max_risk_per_trade_percent:1, active_margin_balance_percent:12,
      fixed_trade_notional_usdt:5, min_trade_notional_usdt:5, min_score:12, max_open_positions:3,
      max_daily_loss_usdt:10, max_trades_per_hour:4, max_losses_per_hour:1, hourly_loss_limit_usdt:1.5,
      loss_cooldown_minutes:180, auto_close_roi_percent:2.2, hard_stop_roi_percent:-1.8,
      trailing_trigger_roi_percent:1.4, trailing_callback_roi_percent:0.35,
      fast_trailing_trigger_roi_percent:0.9, fast_trailing_callback_roi_percent:0.25,
      min_adx:22, min_volume_ratio:1.3, default_leverage:1, preferred_margin_mode:'SPOT_ONLY', leverage_boost_enabled:false, leverage_boost_target:1
    };
    function fill(data) { Object.entries({...ideal, ...data}).forEach(([key, value]) => { const el = form.elements[key]; if (el) el.value = String(value); }); }
    async function load() { const res = await fetch('/api/settings'); fill(await res.json()); }
    document.getElementById('idealBtn').onclick = () => fill(ideal);
    form.onsubmit = async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      ['risk_per_trade_percent','max_risk_per_trade_percent','active_margin_balance_percent','fixed_trade_notional_usdt','min_trade_notional_usdt','max_daily_loss_usdt','hourly_loss_limit_usdt','auto_close_roi_percent','hard_stop_roi_percent','trailing_trigger_roi_percent','trailing_callback_roi_percent','fast_trailing_trigger_roi_percent','fast_trailing_callback_roi_percent','min_adx','min_volume_ratio'].forEach(k => payload[k] = Number(payload[k]));
      ['min_score','max_open_positions','max_trades_per_hour','max_losses_per_hour','loss_cooldown_minutes','default_leverage','leverage_boost_target'].forEach(k => payload[k] = Number(payload[k]));
      payload.ai_enabled = payload.ai_enabled === 'true';
      payload.leverage_boost_enabled = false;
      const res = await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken}, body:JSON.stringify(payload)});
      const data = await res.json();
      document.getElementById('message').textContent = data.message || (res.ok ? 'Saved.' : 'Gagal save.');
    };
    load();
  </script>
</body>
</html>
