<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Bot Trading</title>
  <style>
    :root {
      --bg: #050914;
      --panel: #081126;
      --line: rgba(88, 166, 255, 0.28);
      --text: #e7f2ff;
      --muted: #7f94b8;
      --cyan: #38d8ff;
      --red: #ff5e7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(132deg, rgba(56, 216, 255, 0.16) 0 1px, transparent 1px 28%),
        linear-gradient(26deg, transparent 0 62%, rgba(73, 109, 255, 0.2) 62% 63%, transparent 63%),
        linear-gradient(145deg, var(--bg) 0%, #061437 48%, #02050d 100%);
      color: var(--text);
    }
    main {
      width: min(420px, calc(100vw - 32px));
      background: linear-gradient(180deg, rgba(13, 29, 63, 0.96), rgba(5, 10, 24, 0.96));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }
    form, label {
      display: grid;
      gap: 12px;
    }
    label {
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    input {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      background: rgba(4, 10, 25, 0.72);
      font-size: 14px;
    }
    button {
      min-height: 42px;
      border: 1px solid rgba(56, 216, 255, 0.42);
      border-radius: 6px;
      background: linear-gradient(135deg, #237bff, #20d8ff);
      color: #03101d;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      margin: 0 0 14px;
      color: var(--red);
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Login Bot Trading</h1>
    {% if error_message %}
      <p class="error">{{ error_message }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Masuk</button>
    </form>
  </main>
</body>
</html>
